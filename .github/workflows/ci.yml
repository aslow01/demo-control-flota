# Integración continua (paso 0.4). Nota: hoy GitHub Actions no corre en la cuenta (facturación) y el repositorio
# todavía no tiene remoto: el archivo queda listo y SIN PROBAR hasta que haya un remoto donde correrlo.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Instalación exacta desde el lockfile y sin scripts de instalación de las dependencias.
      - run: npm ci --ignore-scripts
      # svelte-check (componentes) + tsc (todo lo demás). TypeScript 6.0.3: svelte-check 4.7 no corre con TypeScript 7 (S3).
      - run: npm run check
      # Con TZ lejana de Argentina por defecto (vite.config.ts): protege la regla T2.
      - run: npm test
      # La matriz completa de zonas horarias: UTC, Asia/Tokyo y America/Los_Angeles.
      - run: npm run test:tz
      - run: npm run build
      # Sin {@html}, sin Math.random en src/lib, sin reloj fuera de estado/reloj.ts, sin nombres de terceros.
      - run: npm run buscar
      # Sin altas ni críticas (el 18/11/2026 el aviso de `picomatch`, GHSA-fc5q-39xc-vjpf, dejó de alcanzar a la 4.0.7).
      # Si una herramienta de desarrollo vuelve a traer un aviso sin parche, documentarlo con fecha y bajar a `critical`.
      - run: npm audit --audit-level=high
