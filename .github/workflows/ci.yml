# Integración continua (paso 0.4): check, pruebas (también en tres zonas horarias), build, peso, pruebas de punta a punta, búsqueda de prohibidos y audit.
# Acá no existe `scripts/prohibidos.local.json` (no se versiona): la regla de nombres de terceros se omite con un aviso.
# Las acciones van fijadas por su commit (el comentario dice a qué versión corresponde) y los permisos son solo de lectura: no hay secretos.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      # Instalación exacta desde el lockfile y sin scripts de instalación de las dependencias.
      - run: npm ci --ignore-scripts
      # svelte-check (componentes) + tsc (todo lo demás). TypeScript 6.0.3: svelte-check 4.7 no corre con TypeScript 7 (S3).
      - run: npm run check
      # Con TZ lejana de Argentina por defecto (vite.config.ts): protege la regla T2.
      - run: npm test
      # La matriz completa de zonas horarias: UTC, Asia/Tokyo y America/Los_Angeles.
      - run: npm run test:tz
      - run: npm run build
      # Peso del JS con gzip nivel 9: falla si la carga inicial pasa 97.000 B o la primera visita 102.000 B (también el CSS inicial, 26.000 B, y las fuentes, 205.000 B); cada trozo (30.000 B) y el total (180.000 B) solo avisan (docs/stack.md, sección 7).
      # Los avisos salen como anotaciones ::warning:: y la medición queda en el resumen de la corrida (scripts/peso-js.mjs).
      - run: npm run peso
      # Contraste de la paleta (tokens.css, en claro y oscuro): falla si algún par no llega a su mínimo. No necesita el build ni un navegador.
      - run: npm run contraste
      # El navegador de las pruebas de punta a punta se guarda entre corridas: la clave lleva el lockfile, así que cambia cuando cambia la versión de Playwright.
      # Lo que baja `playwright install` es solo un navegador y sus dependencias del sistema; con la caché en su lugar no vuelve a descargarlo.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # `npm ci --ignore-scripts` no instala navegadores por su cuenta: se bajan acá (las dependencias del sistema se instalan siempre; el navegador, solo si la caché no lo tenía).
      - run: npx playwright install --with-deps chromium
      # Pruebas de punta a punta (Playwright + axe) contra dist/ servido con la CSP real. En CI (`CI=true`) dejan el informe en playwright-report/ y las trazas en test-results/.
      - run: npx playwright test
      # Si una prueba falla se sube el informe y las trazas (datos ficticios: el repositorio es público, pero nada de lo que se sube es sensible). Se ven en la corrida, sección «Artifacts».
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: informe-e2e
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
      # Sin {@html}, sin Math.random en src/lib, sin reloj fuera de estado/reloj.ts, sin correos que no sean de ejemplo (los nombres de terceros solo se buscan en local).
      - run: npm run buscar
      # Sin altas ni críticas (el 18/11/2026 el aviso de `picomatch`, GHSA-fc5q-39xc-vjpf, dejó de alcanzar a la 4.0.7).
      # Si una herramienta de desarrollo vuelve a traer un aviso sin parche, documentarlo con fecha y bajar a `critical`.
      - run: npm audit --audit-level=high
